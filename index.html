<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemyTCG - Exclusive Proxy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #111111; color: #fff; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #FFCB05 0%, #d4a700 100%); padding: 40px 20px; text-align: center; color: #111; box-shadow: 0 4px 15px rgba(255, 203, 5, 0.2); }
        h1 { margin: 0; font-weight: 900; font-size: 3em; letter-spacing: -1px; }
        .subtitle { font-weight: 700; opacity: 0.8; margin-top: 5px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .search-bar { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px; border: 2px solid #333; background: #222; color: white; font-size: 1.1em; display: block; margin: -25px auto 40px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); outline: none; transition: border-color 0.3s; }
        .search-bar:focus { border-color: #FFCB05; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card { background: #1c1c1c; border-radius: 16px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: #FFCB05; }
        .card-img { width: 100%; height: 250px; background: #2a2a2a; object-fit: contain; padding: 10px; box-sizing: border-box;}
        .card-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .category { font-size: 0.75em; color: #FFCB05; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .card h3 { margin: 10px 0; font-size: 1.4em; }
        .card p { color: #aaa; font-size: 0.9em; line-height: 1.5; flex-grow: 1; }
        .btn { background: #FFCB05; color: #111; text-align: center; padding: 15px; text-decoration: none; font-weight: 700; border-radius: 8px; margin-top: 20px; transition: background 0.2s; }
        .btn:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>RemyTCG</h1>
        <div class="subtitle">100% Authentic Chinese Pokémon TCG</div>
    </div>
    <input type="text" id="search" class="search-bar" placeholder="🔍 Rechercher un booster, une box..." onkeyup="filtrer()">
    
    <div class="container">
        <div class="grid" id="catalogue"></div>
    </div>

    <script src="stock.js"></script>
</body>
</html>
